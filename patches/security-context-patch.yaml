apiVersion: apps/v1
kind: Deployment
metadata:
  name: security-patch
spec:
  template:
    spec:
      securityContext:
        fsGroup: 1001
      
      containers:
      - name: placeholder
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
          privileged: false
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          runAsUser: 1001
          runAsGroup: 1001
          seccompProfile:
            type: RuntimeDefault