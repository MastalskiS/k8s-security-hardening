---
- name: Configure Kubernetes Node
  hosts: all
  become: true
  tasks:
    - name: Update apt cache and upgrade all packages
      ansible.builtin.apt:
        update_cache: true
        upgrade: 'yes'
        cache_valid_time: 3600

    - name: Install prerequisite packages
      ansible.builtin.apt:
        name:
          - curl
          - apt-transport-https
          - ca-certificates
          - gnupg
          - lsb-release
          - containerd
        state: present

    - name: Disable swap
      changed_when: false
      ansible.builtin.command: swapoff -a
      when: ansible_swaptotal_mb > 0

    - name: Disable swap on boot
      ansible.builtin.lineinfile:
        path: /etc/fstab
        regexp: '^\s*.*?\s+swap\s'
        line: '# \g<0>'
        backrefs: true

    - name: Ensure kernel modules are loaded on boot
      ansible.builtin.copy:
        dest: /etc/modules-load.d/k8s.conf
        content: |
          overlay
          br_netfilter

    - name: Load required kernel modules
      changed_when: false
      ansible.builtin.command: "{{ item }}"
      loop:
        - modprobe overlay
        - modprobe br_netfilter

    - name: Set required sysctl params
      ansible.builtin.copy:
        dest: /etc/sysctl.d/k8s.conf
        content: |
          net.bridge.bridge-nf-call-iptables  = 1
          net.ipv4.ip_forward                 = 1
          net.bridge.bridge-nf-call-ip6tables = 1

    - name: Apply sysctl params without reboot
      ansible.builtin.command: sysctl --system
      changed_when: false


    - name: Create containerd config directory
      ansible.builtin.file:
        path: /etc/containerd
        state: directory
        mode: '0755'

    - name: Generate containerd default config
      ansible.builtin.command: containerd config default > /etc/containerd/config.toml
      args:
        creates: /etc/containerd/config.toml

    - name: Enable SystemdCgroup in containerd config
      ansible.builtin.lineinfile:
        path: /etc/containerd/config.toml
        regexp: 'SystemdCgroup = false'
        line: '            SystemdCgroup = true'
      notify: Restart containerd

    - name: Create directory for containerd proxy config
      ansible.builtin.file:
        path: /etc/systemd/system/containerd.service.d/
        state: directory

    # - name: Add proxy configuration for containerd
    #   ansible.builtin.copy:
    #     dest: /etc/systemd/system/containerd.service.d/http-proxy.conf
    #     content: |
    #       [Service]
    #       Environment="HTTP_PROXY=
    #       Environment="HTTPS_PROXY=
    #       Environment="NO_PROXY=
      # notify:
      #   - Daemon reload
      #   - Restart containerd

    - name: Create directory for Kubernetes apt keyrings
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        mode: '0755'

    - name: Download Kubernetes apt key
      ansible.builtin.get_url:
        url: https://pkgs.k8s.io/core:/stable:/v1.30/deb/Release.key
        dest: /tmp/kubernetes-apt-keyring.asc

    - name: Dearmor the GPG key
      ansible.builtin.command: gpg --dearmor -o /etc/apt/keyrings/kubernetes-apt-keyring.gpg /tmp/kubernetes-apt-keyring.asc
      args:
        creates: /etc/apt/keyrings/kubernetes-apt-keyring.gpg

    - name: Add Kubernetes apt repository
      ansible.builtin.apt_repository:
        repo: "deb [signed-by=/etc/apt/keyrings/kubernetes-apt-keyring.gpg] https://pkgs.k8s.io/core:/stable:/v1.30/deb/ /"
        state: present
        filename: kubernetes

    - name: Install Kubernetes components
      ansible.builtin.apt:
        name:
          - kubelet
          - kubeadm
          - kubectl
        state: present
        update_cache: true

    - name: Hold Kubernetes components at their current version
      ansible.builtin.dpkg_selections:
        name: "{{ item }}"
        selection: hold
      loop:
        - kubelet
        - kubeadm
        - kubectl

    - name: Create directory for kubelet service overrides
      ansible.builtin.file:
        path: /etc/systemd/system/kubelet.service.d/
        state: directory

    - name: Add proxy configuration for kubelet
      ansible.builtin.copy:
        dest: /etc/systemd/system/kubelet.service.d/http-proxy.conf
        content: |
          [Service]
          Environment="HTTP_PROXY=
          Environment="HTTPS_PROXY="
          Environment="NO_PROXY="
      notify:
        - Daemon reload
        - Restart kubelet

  handlers:
    - name: Restart containerd
      ansible.builtin.service:
        name: containerd
        state: restarted

    - name: Restart kubelet
      ansible.builtin.service:
        name: kubelet
        state: restarted

    - name: Daemon reload
      ansible.builtin.systemd:
        daemon_reload: true
