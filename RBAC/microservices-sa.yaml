#Definicje Service Accout dla każdego serwisu, z uwagi na to, że żaden z nich nie musi łączyć
#się z API K8s mają nie tworzymy dla nich Roles i role-binding, by minimalozowac ich uprawnienia
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: frontend-sa
  namespace: default
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cartservice-sa
  namespace: default
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: productcatalogservice-sa
  namespace: default
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: currencyservice-sa
  namespace: default
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: paymentservice-sa
  namespace: default
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: shippingservice-sa
  namespace: default
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: emailservice-sa
  namespace: default
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: checkoutservice-sa
  namespace: default
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: recommendationservice-sa
  namespace: default
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: adservice-sa
  namespace: default



# # Patch ze zmianami
