apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: emailservice-netpol
  namespace: default
spec:
  podSelector:
    matchLabels:
      app: emailservice
  policyTypes:
  - Ingress
  ingress:
  - from:
    - podSelector: {matchLabels: {app: checkoutservice}}
    ports:
    - protocol: TCP
      port: 5000
